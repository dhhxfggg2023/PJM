# PJM CI — 构建 / 单测 / 静态检查
#
# 触发：push 与 PR 到 main。
# 环境：GitHub ubuntu-latest + 显式安装缺失的 SDK 组件
#   - platforms;android-37.0 / build-tools;36.1.0 / ndk;28.2.13676358 / cmake;3.22.1
#   （平台包名带次版本号；写成 platforms;android-37 或 build-tools;37.0.0 仓库里不存在，会直接失败）
# 依赖从 google() / mavenCentral() 解析。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          # 平台包名带次版本号（37.0），且 build-tools 用 AGP 9.3 默认的 36.1.0；
          # 老的写法 platforms;android-37 / build-tools;37.0.0 在仓库里不存在，会让本步骤直接失败。
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-37.0" \
            "build-tools;36.1.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"

      - name: Compile instrumented tests
        run: ./gradlew -Dgradle.user.home=$HOME/.gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Unit tests
        run: ./gradlew -Dgradle.user.home=$HOME/.gradle :app:testDebugUnitTest --stacktrace

      - name: ktlint check
        run: ./gradlew -Dgradle.user.home=$HOME/.gradle ktlintCheck --stacktrace

      - name: Assemble release
        run: ./gradlew -Dgradle.user.home=$HOME/.gradle :app:assembleRelease --stacktrace

      - name: Upload debug test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
