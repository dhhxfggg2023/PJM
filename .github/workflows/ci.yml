# PJM CI — 构建 / 单测 / 静态检查
#
# 触发：push 与 PR 到 main。
# 环境：GitHub ubuntu-latest 已预装所需 Android SDK 组件
#   - platforms;android-37.0 / build-tools;37.0.0 / NDK 28.2.13676358 / cmdline-tools
#   （无需再执行 sdkmanager --install，runner 已全部具备）
# 依赖从 google() / mavenCentral() 解析。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: ktlint check
        run: ./gradlew ktlintCheck --stacktrace

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload debug test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
