# PJM CI — 构建 / 单测 / 静态检查
#
# 触发：push 与 PR 到 main。
# 环境要点（与本地一致）：
#   - JDK 17
#   - Android SDK（compileSdk 37, NDK 28.2.13676358, CMake 3.22.1）
#   - 依赖从 google() / mavenCentral() 解析（不依赖本地缓存）

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK components
        run: |
          echo "y" | sdkmanager --install \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "platform-tools"
          echo "y" | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: ktlint check
        run: ./gradlew ktlintCheck --stacktrace

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload debug test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
