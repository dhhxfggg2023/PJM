# PJM CI — 构建 / 单测 / 静态检查
#
# 触发：push 与 PR 到 main。
# 环境：GitHub ubuntu-latest + 显式安装缺失的 SDK 组件
#   - platforms;android-37.0 / build-tools;36.1.0 / ndk;28.2.13676358 / cmake;3.22.1
#   （平台包名带次版本号；写成 platforms;android-37 或 build-tools;37.0.0 仓库里不存在，会直接失败）
# 依赖从 google() / mavenCentral() 解析。

name: CI

on:
  push:
    branches: [main]
    # 版本 tag 也要跑：release 产物（APK）依赖它上传，之前打 tag 完全没有触发
    tags: ["v*", "V*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          # 平台包名带次版本号（37.0），且 build-tools 用 AGP 9.3 默认的 36.1.0；
          # 老的写法 platforms;android-37 / build-tools;37.0.0 在仓库里不存在，会让本步骤直接失败。
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-37.0" \
            "build-tools;36.1.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"

      - name: Compile instrumented tests
        run: ./gradlew -Dgradle.user.home=$HOME/.gradle :app:assembleDebugAndroidTest --stacktrace

      # 核心修复：此前只有 assembleDebugAndroidTest（编译），仪器化测试从未真正执行过。
      # 注意（非门禁）：模拟器架构 x86_64 与 abiFilters 不匹配，native 库不可用，该步骤不作为门禁。
      #  - app/build.gradle.kts 的 abiFilters 只有 armeabi-v7a / arm64-v8a，
      #    x86_64 模拟器上原生库不可用；当前两个用例（ExampleInstrumentedTest /
      #    DatabaseMigrationTest）都不触达 JNI，因此可以跑通，但无法覆盖加密等原生路径；
      #  - continue-on-error: true 保留，模拟器/ABI 环境问题不阻塞主 CI；
      #    等 debug 构建补上 x86_64 ABI 后，再考虑去掉 continue-on-error 变成硬门禁。
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (emulator)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew -Dgradle.user.home=$HOME/.gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Unit tests
        run: ./gradlew -Dgradle.user.home=$HOME/.gradle :app:testDebugUnitTest --stacktrace

      # 核心修复：ktlint 只查 Kotlin 格式，Android lint（NewApi/导出组件/权限）完全没跑。
      - name: Android lint (debug)
        run: ./gradlew -Dgradle.user.home=$HOME/.gradle :app:lintDebug --stacktrace

      - name: ktlint check
        run: ./gradlew -Dgradle.user.home=$HOME/.gradle ktlintCheck --stacktrace

      - name: Assemble release
        run: ./gradlew -Dgradle.user.home=$HOME/.gradle :app:assembleRelease --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          retention-days: 7

      - name: Upload debug test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7

      # P2：release APK 只在 assembleRelease 成功后上传（旧写法 always() 会在构建失败时上传陈旧产物）；报告类上传保留 always() 供失败诊断。
      - name: Upload release mapping
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 7

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
